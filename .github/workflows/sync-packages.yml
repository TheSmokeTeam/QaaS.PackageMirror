name: Sync Restored Packages
# Polls source repositories for restore artifacts without requiring source-side dispatch.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

env:
  SOURCE_REPOSITORY: ${{ github.repository_owner }}/QaaS.Framework
  SOURCE_WORKFLOW_NAME: CI
  SOURCE_ARTIFACT_NAME: restored-packages

jobs:
  sync:
    runs-on: windows-latest

    steps:
      - name: Checkout mirror repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve latest source artifact run
        id: source_run
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $runsUrl = "https://api.github.com/repos/${{ env.SOURCE_REPOSITORY }}/actions/runs?per_page=30"
          $runsResponse = Invoke-RestMethod -Method Get -Headers $headers -Uri $runsUrl
          $candidate = $null

          foreach ($run in $runsResponse.workflow_runs) {
            if ($run.name -ne '${{ env.SOURCE_WORKFLOW_NAME }}') { continue }
            if ($run.conclusion -ne 'success') { continue }

            $artifactsUrl = "https://api.github.com/repos/${{ env.SOURCE_REPOSITORY }}/actions/runs/$($run.id)/artifacts"
            $artifactsResponse = Invoke-RestMethod -Method Get -Headers $headers -Uri $artifactsUrl
            $artifact = $artifactsResponse.artifacts | Where-Object { $_.name -eq '${{ env.SOURCE_ARTIFACT_NAME }}' -and -not $_.expired } | Select-Object -First 1
            if ($null -ne $artifact) {
              $candidate = $run
              break
            }
          }

          if ($null -eq $candidate) {
            "found=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          "found=true" >> $env:GITHUB_OUTPUT
          "run_id=$($candidate.id)" >> $env:GITHUB_OUTPUT
          "origin_url=$($candidate.html_url)" >> $env:GITHUB_OUTPUT

      - name: Download restored package artifact
        if: steps.source_run.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
          repository: ${{ env.SOURCE_REPOSITORY }}
          run-id: ${{ steps.source_run.outputs.run_id }}
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: incoming\restored-packages

      - name: Read artifact metadata
        if: steps.source_run.outputs.found == 'true'
        id: metadata
        shell: pwsh
        run: |
          $metadataPath = Join-Path $PWD 'incoming\restored-packages\restore-artifact-metadata.json'
          if (-not (Test-Path $metadataPath)) {
            throw "Missing restore artifact metadata file: $metadataPath"
          }

          $metadata = Get-Content $metadataPath | ConvertFrom-Json
          "source_repo=$($metadata.repository)" >> $env:GITHUB_OUTPUT
          "source_tag=$($metadata.tag)" >> $env:GITHUB_OUTPUT

      - name: Update mirror contents
        if: steps.source_run.outputs.found == 'true'
        run: >
          dotnet run --project .\QaaS.PackageMirror\QaaS.PackageMirror.csproj --
          --artifact-root .\incoming\restored-packages
          --mirror-root .
          --source-repo "${{ steps.metadata.outputs.source_repo }}"
          --source-tag "${{ steps.metadata.outputs.source_tag }}"
          --origin "${{ steps.source_run.outputs.origin_url }}"
          --source-run-id "${{ steps.source_run.outputs.run_id }}"

      - name: Commit updated packages
        if: steps.source_run.outputs.found == 'true'
        shell: pwsh
        run: |
          git config user.name "qaas-package-mirror"
          git config user.email "qaas-package-mirror@example.local"
          git add packages state README.md CHANGELOG.md scripts
          if ((git diff --cached --name-only).Length -eq 0) {
            Write-Host "No mirror changes detected."
            exit 0
          }

          git commit -m "mirror: ${{ steps.metadata.outputs.source_repo }} ${{ steps.metadata.outputs.source_tag }}"
          git push origin HEAD:master
