name: Sync Restored Packages

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/sync-packages.yml
      - scripts/**
      - QaaS.PackageMirror/**
      - QaaS.PackageMirror.FamilySchemas/**
      - QaaS.PackageMirror.sln
  push:
    branches:
      - master
    paths:
      - .github/workflows/sync-packages.yml
      - scripts/**
      - QaaS.PackageMirror/**
      - QaaS.PackageMirror.FamilySchemas/**
      - QaaS.PackageMirror.sln
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest

    steps:
      - name: Checkout mirror repository
        uses: actions/checkout@v6

      - name: Install dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build mirror solution
        shell: pwsh
        run: dotnet build .\QaaS.PackageMirror.sln -c Release

      - name: Test mirror solution
        shell: pwsh
        run: dotnet test .\QaaS.PackageMirror.sln -c Release --no-build

      - name: Regenerate family schemas
        shell: pwsh
        run: |
          .\scripts\Generate-FamilySchemas.ps1 `
            -MirrorRoot $PWD `
            -SnapshotId pr-validation

      - name: Verify generated schema artifacts
        shell: pwsh
        run: |
          $requiredPaths = @(
            'schemas/index.json',
            'schemas/runner-family/latest/schema.json',
            'schemas/runner-family/latest/metadata.json',
            'schemas/runner-family/latest/docs-manifest.json',
            'schemas/runner-family/latest/hook-catalog.json',
            'schemas/runner-family/latest/docs-diff.json',
            'schemas/mocker-family/latest/schema.json',
            'schemas/mocker-family/latest/metadata.json',
            'schemas/mocker-family/latest/docs-manifest.json',
            'schemas/mocker-family/latest/hook-catalog.json',
            'schemas/mocker-family/latest/docs-diff.json'
          )

          foreach ($path in $requiredPaths) {
            if (-not (Test-Path $path)) {
              throw "Missing required generated artifact: $path"
            }
          }

  sync:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest

    steps:
      - name: Checkout mirror repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Refresh master before update
        shell: pwsh
        run: git pull --ff-only origin master

      - name: Rebuild mirror contents
        shell: pwsh
        env:
          PACKAGE_MIRROR_TOKEN: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
        run: |
          .\scripts\Sync-RestoredPackages.ps1 `
            -GitHubToken $env:PACKAGE_MIRROR_TOKEN

      - name: Validate mirror outputs
        shell: pwsh
        run: |
          $requiredPaths = @(
            'packages/qaas',
            'packages/not-qaas',
            'schemas/index.json',
            'schemas/runner-family/latest/schema.json',
            'schemas/runner-family/latest/metadata.json',
            'schemas/runner-family/latest/docs-manifest.json',
            'schemas/runner-family/latest/hook-catalog.json',
            'schemas/runner-family/latest/docs-diff.json',
            'schemas/mocker-family/latest/schema.json',
            'schemas/mocker-family/latest/metadata.json',
            'schemas/mocker-family/latest/docs-manifest.json',
            'schemas/mocker-family/latest/hook-catalog.json',
            'schemas/mocker-family/latest/docs-diff.json'
          )

          foreach ($path in $requiredPaths) {
            if (-not (Test-Path $path)) {
              throw "Missing required mirror output: $path"
            }
          }

          if ((Get-ChildItem packages/qaas -Directory | Measure-Object).Count -eq 0) {
            throw 'packages/qaas does not contain any mirrored packages.'
          }

          if ((Get-ChildItem packages/not-qaas -Directory | Measure-Object).Count -eq 0) {
            throw 'packages/not-qaas does not contain any mirrored packages.'
          }

      - name: Commit updated packages
        id: commit
        shell: pwsh
        run: |
          git config user.name "qaas-package-mirror"
          git config user.email "qaas-package-mirror@example.local"
          git add packages schemas state README.md CHANGELOG.md QaaS.PackageMirror.sln QaaS.PackageMirror QaaS.PackageMirror.FamilySchemas scripts .github/workflows/sync-packages.yml
          if ((git diff --cached --name-only).Length -eq 0) {
            "has_changes=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "No mirror changes detected."
            exit 0
          }

          git commit -m "mirror: full sync"
          "has_changes=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Push updated packages
        if: steps.commit.outputs.has_changes == 'true'
        shell: pwsh
        run: git push origin HEAD:master

      - name: Publish mirror release
        if: steps.commit.outputs.has_changes == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .\scripts\Publish-MirrorRelease.ps1 `
            -WorkspaceRoot $PWD `
            -GitHubRepository $env:GITHUB_REPOSITORY `
            -GitHubToken $env:GITHUB_TOKEN
