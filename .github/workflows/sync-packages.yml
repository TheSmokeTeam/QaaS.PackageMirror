name: CI

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/sync-packages.yml
      - QaaS.PackageMirror/**
      - QaaS.PackageMirror.ConfigurationStub/**
      - QaaS.PackageMirror.FamilySchemas/**
      - QaaS.PackageMirror.Tests/**
      - QaaS.PackageMirror.Tools/**
      - QaaS.PackageMirror.sln
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the mirror GitHub release
        required: true
        type: boolean
        default: true
      create_docs_pr:
        description: Create a qaas-docs pull request with regenerated docs
        required: true
        type: boolean
        default: true
      docs_drift_check_only:
        description: Fail when regenerated docs differ instead of opening a docs PR
        required: true
        type: boolean
        default: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOURCE_ARCHIVES_ROOT: source-code-zips
  DOCS_ZIM_ROOT: qaas-docs-zim
  MAX_DOCS_PR_CHANGED_FILES: 80

jobs:
  sync-release-and-docs:
    runs-on: windows-latest

    steps:
      - name: Checkout mirror repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build mirror solution
        shell: pwsh
        run: dotnet build .\QaaS.PackageMirror.sln -c Release

      - name: Test mirror solution
        shell: pwsh
        run: dotnet test .\QaaS.PackageMirror.sln -c Release --no-build

      - name: Refresh current branch before update
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: git pull --ff-only origin $env:GITHUB_REF_NAME

      - name: Capture previous package baseline
        if: github.event_name == 'workflow_dispatch'
        id: previous_packages
        shell: pwsh
        run: |
          $baselineRoot = Join-Path $env:RUNNER_TEMP "qaas-package-baseline"
          if (Test-Path $baselineRoot) {
            Remove-Item -LiteralPath $baselineRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $baselineRoot | Out-Null

          $packagesRoot = Join-Path $PWD "packages"
          if (Test-Path $packagesRoot) {
            Copy-Item -Path $packagesRoot -Destination $baselineRoot -Recurse -Force
          }

          "path=$baselineRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Rebuild mirror contents
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          PACKAGE_MIRROR_TOKEN: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
        run: |
          dotnet run --project .\QaaS.PackageMirror.Tools\QaaS.PackageMirror.Tools.csproj -- `
            sync-restored-packages `
            --github-token $env:PACKAGE_MIRROR_TOKEN

      - name: Validate mirror outputs
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $requiredPaths = @(
            'packages/qaas',
            'packages/not-qaas',
            'schemas/runner-family/latest/schema.json',
            'schemas/runner-family/latest/docs-manifest.json',
            'schemas/runner-family/latest/hook-catalog.json',
            'schemas/mocker-family/latest/schema.json',
            'schemas/mocker-family/latest/docs-manifest.json',
            'schemas/mocker-family/latest/hook-catalog.json'
          )

          foreach ($path in $requiredPaths) {
            if (-not (Test-Path $path)) {
              throw "Missing required mirror output: $path"
            }
          }

          if ((Get-ChildItem packages/qaas -Directory | Measure-Object).Count -eq 0) {
            throw 'packages/qaas does not contain any mirrored packages.'
          }

          if ((Get-ChildItem packages/not-qaas -Directory | Measure-Object).Count -eq 0) {
            throw 'packages/not-qaas does not contain any mirrored packages.'
          }

      - name: Commit updated mirror contents
        if: github.event_name == 'workflow_dispatch' && !inputs.docs_drift_check_only
        id: mirror_commit
        shell: pwsh
        run: |
          git config user.name "qaas-package-mirror"
          git config user.email "qaas-package-mirror@example.local"
          git add packages schemas state README.md CHANGELOG.md QaaS.PackageMirror.sln QaaS.PackageMirror QaaS.PackageMirror.ConfigurationStub QaaS.PackageMirror.FamilySchemas QaaS.PackageMirror.Tools .github/workflows/sync-packages.yml
          if ((git diff --cached --name-only).Length -eq 0) {
            "has_changes=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "No mirror changes detected."
            exit 0
          }

          git commit -m "mirror: full sync"
          "has_changes=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Push updated mirror contents
        if: steps.mirror_commit.outputs.has_changes == 'true'
        shell: pwsh
        run: |
          git fetch origin $env:GITHUB_REF_NAME
          git pull --rebase origin $env:GITHUB_REF_NAME
          git push origin HEAD:$env:GITHUB_REF_NAME

      - name: Prepare sanitized source archives
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && !inputs.docs_drift_check_only
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          function Get-StateTag([string]$FileName) {
            $state = Get-Content (Join-Path $PWD "state\$FileName") -Raw | ConvertFrom-Json
            return [string]$state.tag
          }

          $ciDirectories = @('.github', '.gitlab', '.circleci', '.azuredevops', '.buildkite', '.teamcity')
          $ciFiles = @('.appveyor.yml', '.drone.yml', '.gitlab-ci.yml', '.travis.yml', 'appveyor.yml', 'azure-pipelines.yml', 'azure-pipelines.yaml', 'buildkite.yml', 'Jenkinsfile')

          function Test-CiPath([string]$RelativePath) {
            $segments = $RelativePath -split '[\\/]'
            foreach ($segment in $segments) {
              if ($ciDirectories -contains $segment) {
                return $true
              }
            }

            if ($segments.Length -gt 0 -and ($ciFiles -contains $segments[$segments.Length - 1])) {
              return $true
            }

            return $false
          }

          $sources = @(
            @{ Name = 'qaas-framework-source'; Repository = 'TheSmokeTeam/QaaS.Framework'; Ref = (Get-StateTag 'TheSmokeTeam_QaaS.Framework.json') },
            @{ Name = 'qaas-mocker-communicationobjects-source'; Repository = 'TheSmokeTeam/Qaas.Mocker.CommunicationObjects'; Ref = (Get-StateTag 'TheSmokeTeam_Qaas.Mocker.CommunicationObjects.json') },
            @{ Name = 'qaas-runner-source'; Repository = 'TheSmokeTeam/QaaS.Runner'; Ref = (Get-StateTag 'TheSmokeTeam_QaaS.Runner.json') },
            @{ Name = 'qaas-mocker-source'; Repository = 'TheSmokeTeam/QaaS.Mocker'; Ref = (Get-StateTag 'TheSmokeTeam_QaaS.Mocker.json') },
            @{ Name = 'qaas-common-assertions-source'; Repository = 'TheSmokeTeam/QaaS.Common.Assertions'; Ref = (Get-StateTag 'TheSmokeTeam_QaaS.Common.Assertions.json') },
            @{ Name = 'qaas-common-generators-source'; Repository = 'TheSmokeTeam/QaaS.Common.Generators'; Ref = (Get-StateTag 'TheSmokeTeam_QaaS.Common.Generators.json') },
            @{ Name = 'qaas-common-probes-source'; Repository = 'TheSmokeTeam/QaaS.Common.Probes'; Ref = (Get-StateTag 'TheSmokeTeam_QaaS.Common.Probes.json') },
            @{ Name = 'qaas-common-processors-source'; Repository = 'TheSmokeTeam/QaaS.Common.Processors'; Ref = (Get-StateTag 'TheSmokeTeam_QaaS.Common.Processors.json') }
          )

          $outputDir = Join-Path $PWD $env:SOURCE_ARCHIVES_ROOT
          $workDir = Join-Path $env:RUNNER_TEMP "qaas-source-archives"
          $bundleRoot = Join-Path $workDir "qaas-source-code"
          if (Test-Path $outputDir) {
            Remove-Item -LiteralPath $outputDir -Recurse -Force
          }
          if (Test-Path $workDir) {
            Remove-Item -LiteralPath $workDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $outputDir, $workDir, $bundleRoot | Out-Null

          $headers = @{ 'User-Agent' = 'qaas-package-mirror-source-archiver' }
          if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
            $headers['Authorization'] = "Bearer $env:GITHUB_TOKEN"
          }

          foreach ($source in $sources) {
            $owner, $repo = $source.Repository.Split('/', 2)
            $rawArchivePath = Join-Path $workDir "$($source.Name).raw.zip"
            $extractRoot = Join-Path $workDir "$($source.Name).extract"
            $cleanRoot = Join-Path $bundleRoot $source.Name
            $url = "https://codeload.github.com/$owner/$repo/zip/$($source.Ref)"

            Invoke-WebRequest -Uri $url -Headers $headers -OutFile $rawArchivePath
            Expand-Archive -Path $rawArchivePath -DestinationPath $extractRoot -Force
            $archiveRoot = Get-ChildItem $extractRoot -Directory | Select-Object -First 1
            if ($null -eq $archiveRoot) {
              throw "Could not locate extracted source root for $($source.Repository)@$($source.Ref)"
            }

            New-Item -ItemType Directory -Force -Path $cleanRoot | Out-Null
            foreach ($file in Get-ChildItem $archiveRoot.FullName -Recurse -File -Force) {
              $relativePath = [System.IO.Path]::GetRelativePath($archiveRoot.FullName, $file.FullName)
              if (Test-CiPath $relativePath) {
                continue
              }

              $targetPath = Join-Path $cleanRoot $relativePath
              New-Item -ItemType Directory -Force -Path ([System.IO.Path]::GetDirectoryName($targetPath)) | Out-Null
              Copy-Item -LiteralPath $file.FullName -Destination $targetPath -Force
            }

            Write-Host "Prepared sanitized source folder $cleanRoot from $($source.Repository)@$($source.Ref)"
          }

          $destinationPath = Join-Path $outputDir "qaas-source-code.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory($bundleRoot, $destinationPath, [System.IO.Compression.CompressionLevel]::Optimal, $false)

          $archive = [System.IO.Compression.ZipFile]::OpenRead($destinationPath)
          try {
            foreach ($entry in $archive.Entries) {
              if (Test-CiPath $entry.FullName) {
                throw "Sanitized source archive $destinationPath still contains CI path $($entry.FullName)"
              }
            }
          }
          finally {
            $archive.Dispose()
          }

          Write-Host "Prepared sanitized source archive $destinationPath with $($sources.Count) source folders"

      - name: Download latest qaas-docs offline bundle
        id: docs_zim
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && !inputs.docs_drift_check_only
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
        run: |
          $docsZimRoot = Join-Path $PWD $env:DOCS_ZIM_ROOT
          if (Test-Path $docsZimRoot) {
            Remove-Item -LiteralPath $docsZimRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $docsZimRoot | Out-Null
          $previousNativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          try {
            gh release download `
              --repo TheSmokeTeam/qaas-docs `
              --pattern 'qaas-docs.zim' `
              --pattern 'qaas-docs-zim-provenance.json' `
              --dir $docsZimRoot
            $releaseDownloadExitCode = $LASTEXITCODE
          }
          finally {
            $PSNativeCommandUseErrorActionPreference = $previousNativePreference
          }

          if ($releaseDownloadExitCode -ne 0) {
            Write-Host "No qaas-docs ZIM release asset was downloaded from the latest release."
          }

          $zimFiles = @(Get-ChildItem -LiteralPath $docsZimRoot -Filter '*.zim' -File)
          $provenancePath = Join-Path $docsZimRoot 'qaas-docs-zim-provenance.json'
          if ($zimFiles.Count -ne 1 -or -not (Test-Path -LiteralPath $provenancePath -PathType Leaf)) {
            Write-Host "No complete qaas-docs offline release contract found. Falling back to the latest successful master docs workflow artifact."
            Remove-Item -LiteralPath $docsZimRoot -Recurse -Force
            New-Item -ItemType Directory -Force -Path $docsZimRoot | Out-Null
            $run = gh run list `
              --repo TheSmokeTeam/qaas-docs `
              --workflow docs.yml `
              --branch master `
              --status success `
              --limit 1 `
              --json databaseId `
              | ConvertFrom-Json `
              | Select-Object -First 1

            if ($null -ne $run) {
              gh run download $run.databaseId `
                --repo TheSmokeTeam/qaas-docs `
                --name qaas-docs-zim `
                --dir $docsZimRoot
            }

            $zimFiles = @(Get-ChildItem -LiteralPath $docsZimRoot -Filter '*.zim' -File)
            $provenancePath = Join-Path $docsZimRoot 'qaas-docs-zim-provenance.json'
          }

          if ($zimFiles.Count -ne 1 -or -not (Test-Path -LiteralPath $provenancePath -PathType Leaf)) {
            $message = "A compliant qaas-docs release requires exactly one ZIM and qaas-docs-zim-provenance.json; found $($zimFiles.Count) ZIM file(s) and provenance=$((Test-Path -LiteralPath $provenancePath -PathType Leaf))."
            throw "$message Cannot honor publish_release=true until qaas-docs publishes the complete contract. Run the docs-only rollout with publish_release=false first."
          }

          dotnet run --project .\QaaS.PackageMirror.Tools\QaaS.PackageMirror.Tools.csproj -- `
            sync-docs-zim-provenance `
            --docs-root $docsZimRoot `
            --check

          "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Downloaded qaas-docs ZIM asset: $($zimFiles[0].FullName)"

      - name: Publish mirror release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && !inputs.docs_drift_check_only && steps.docs_zim.outputs.ready == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
        run: |
          dotnet run --project .\QaaS.PackageMirror.Tools\QaaS.PackageMirror.Tools.csproj -- `
            publish-mirror-release `
            --workspace-root $PWD `
            --github-repository $env:GITHUB_REPOSITORY `
            --branch-name $env:GITHUB_REF_NAME `
            --previous-packages-root "${{ steps.previous_packages.outputs.path }}" `
            --source-archives-root (Join-Path $PWD $env:SOURCE_ARCHIVES_ROOT) `
            --docs-zim-root (Join-Path $PWD $env:DOCS_ZIM_ROOT) `
            --github-token $env:GITHUB_TOKEN

      - name: Decide whether to sync docs
        id: docs_sync
        shell: bash
        run: |
          enabled=false
          check_only=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.docs_drift_check_only }}" == "true" ]]; then
              enabled=true
              check_only=true
            elif [[ "${{ inputs.create_docs_pr }}" == "true" ]]; then
              enabled=true
            fi
          elif [[ "${{ steps.mirror_commit.outputs.has_changes }}" == "true" ]]; then
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "check_only=$check_only" >> "$GITHUB_OUTPUT"

      - name: Resolve docs source refs
        if: steps.docs_sync.outputs.enabled == 'true'
        id: refs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
        run: |
          function Get-StateTag([string]$FileName) {
            $state = Get-Content (Join-Path $PWD "state\$FileName") -Raw | ConvertFrom-Json
            return [string]$state.tag
          }

          "runner_ref=$(Get-StateTag 'TheSmokeTeam_QaaS.Runner.json')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "mocker_ref=$(Get-StateTag 'TheSmokeTeam_QaaS.Mocker.json')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "framework_ref=$(Get-StateTag 'TheSmokeTeam_QaaS.Framework.json')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "assertions_ref=$(Get-StateTag 'TheSmokeTeam_QaaS.Common.Assertions.json')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "generators_ref=$(Get-StateTag 'TheSmokeTeam_QaaS.Common.Generators.json')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "probes_ref=$(Get-StateTag 'TheSmokeTeam_QaaS.Common.Probes.json')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "processors_ref=$(Get-StateTag 'TheSmokeTeam_QaaS.Common.Processors.json')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "docs_branch=feature/package-mirror-docs-$env:GITHUB_RUN_ID" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $workflowRun = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | ConvertFrom-Json
          $runCreatedAt = [DateTimeOffset]::Parse(
            [string]$workflowRun.created_at,
            [System.Globalization.CultureInfo]::InvariantCulture,
            [System.Globalization.DateTimeStyles]::RoundtripKind
          )
          $docsUpdatedDateUtc = $runCreatedAt.ToUniversalTime().ToString(
            'yyyy-MM-dd',
            [System.Globalization.CultureInfo]::InvariantCulture
          )
          "docs_updated_date_utc=$docsUpdatedDateUtc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout qaas-docs
        if: steps.docs_sync.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          repository: TheSmokeTeam/qaas-docs
          ref: master
          token: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
          path: qaas-docs
          submodules: recursive
          fetch-depth: 0

      - name: Use latest docs generator
        if: steps.docs_sync.outputs.enabled == 'true'
        shell: pwsh
        run: |
          git -C qaas-docs\tools\QaaS.Docs.Generator fetch origin main
          git -C qaas-docs\tools\QaaS.Docs.Generator checkout origin/main

      - name: Checkout runner source
        if: steps.docs_sync.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          repository: TheSmokeTeam/QaaS.Runner
          ref: ${{ steps.refs.outputs.runner_ref }}
          token: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
          path: QaaS.Runner

      - name: Checkout mocker source
        if: steps.docs_sync.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          repository: TheSmokeTeam/QaaS.Mocker
          ref: ${{ steps.refs.outputs.mocker_ref }}
          token: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
          path: QaaS.Mocker

      - name: Checkout framework source
        if: steps.docs_sync.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          repository: TheSmokeTeam/QaaS.Framework
          ref: ${{ steps.refs.outputs.framework_ref }}
          token: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
          path: QaaS.Framework

      - name: Checkout assertions source
        if: steps.docs_sync.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          repository: TheSmokeTeam/QaaS.Common.Assertions
          ref: ${{ steps.refs.outputs.assertions_ref }}
          token: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
          path: QaaS.Common.Assertions

      - name: Checkout generators source
        if: steps.docs_sync.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          repository: TheSmokeTeam/QaaS.Common.Generators
          ref: ${{ steps.refs.outputs.generators_ref }}
          token: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
          path: QaaS.Common.Generators

      - name: Checkout probes source
        if: steps.docs_sync.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          repository: TheSmokeTeam/QaaS.Common.Probes
          ref: ${{ steps.refs.outputs.probes_ref }}
          token: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
          path: QaaS.Common.Probes

      - name: Checkout processors source
        if: steps.docs_sync.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          repository: TheSmokeTeam/QaaS.Common.Processors
          ref: ${{ steps.refs.outputs.processors_ref }}
          token: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
          path: QaaS.Common.Processors

      - name: Setup Python
        if: steps.docs_sync.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install docs dependencies
        if: steps.docs_sync.outputs.enabled == 'true'
        shell: pwsh
        run: pip install -r .\qaas-docs\requirements.txt

      - name: Regenerate or check docs from mirrored source refs
        if: steps.docs_sync.outputs.enabled == 'true'
        shell: pwsh
        env:
          DOCS_DRIFT_CHECK_ONLY: ${{ steps.docs_sync.outputs.check_only }}
        run: |
          $env:QAAS_NUGET_SOURCE_URL = (Join-Path $PWD 'packages\qaas')
          $generatorArguments = @(
            'run',
            '--project',
            '.\qaas-docs\tools\QaaS.Docs.Generator\QaaS.Docs.Tools\QaaS.Docs.Tools.csproj',
            '--',
            'generate-reference-docs',
            '--docs-root',
            (Join-Path $PWD 'qaas-docs'),
            '--mirror-root',
            $PWD,
            '--runner-root',
            (Join-Path $PWD 'QaaS.Runner'),
            '--mocker-root',
            (Join-Path $PWD 'QaaS.Mocker'),
            '--framework-root',
            (Join-Path $PWD 'QaaS.Framework'),
            '--assertions-root',
            (Join-Path $PWD 'QaaS.Common.Assertions'),
            '--generators-root',
            (Join-Path $PWD 'QaaS.Common.Generators'),
            '--probes-root',
            (Join-Path $PWD 'QaaS.Common.Probes'),
            '--processors-root',
            (Join-Path $PWD 'QaaS.Common.Processors'),
            '--build-site'
          )

          if ($env:DOCS_DRIFT_CHECK_ONLY -eq 'true') {
            $generatorArguments += '--check'
          }

          dotnet @generatorArguments

          git -C .\qaas-docs\tools\QaaS.Docs.Generator restore -- Snapshots

      - name: Write or validate docs ZIM provenance
        if: steps.docs_sync.outputs.enabled == 'true'
        shell: pwsh
        env:
          DOCS_DRIFT_CHECK_ONLY: ${{ steps.docs_sync.outputs.check_only }}
          DOCS_UPDATED_DATE_UTC: ${{ steps.refs.outputs.docs_updated_date_utc }}
        run: |
          $provenanceArguments = @(
            'run',
            '--project',
            '.\QaaS.PackageMirror.Tools\QaaS.PackageMirror.Tools.csproj',
            '--',
            'sync-docs-zim-provenance',
            '--docs-root',
            (Join-Path $PWD 'qaas-docs')
          )

          if ($env:DOCS_DRIFT_CHECK_ONLY -eq 'true') {
            $provenanceArguments += '--check'
          }
          else {
            $provenanceArguments += @('--docs-updated-date-utc', $env:DOCS_UPDATED_DATE_UTC)
          }

          dotnet @provenanceArguments

      - name: Validate generated docs v2 contract
        if: steps.docs_sync.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          sed 's/\r$//' qaas-docs/tools/ci/check-frontmatter.sh > "$RUNNER_TEMP/check-frontmatter.sh"
          (cd qaas-docs && bash "$RUNNER_TEMP/check-frontmatter.sh")
          (cd qaas-docs && npx markdownlint-cli2 "docs/**/*.md" "!docs/_generated/**")

          mkdir -p QaaS.PackageMirror/schemas
          cp -R schemas/runner-family QaaS.PackageMirror/schemas/
          cp -R schemas/mocker-family QaaS.PackageMirror/schemas/
          (cd qaas-docs && python tools/ci/check-verification-markers.py)
          (cd qaas-docs && python tools/ci/check-reference-skeleton.py)
          (cd qaas-docs && python tools/ci/check-page-headings.py)
          (cd qaas-docs && python tools/ci/check-heading-anchors.py)
          (cd qaas-docs && python tools/ci/check-example-density.py)
          (cd qaas-docs && python tools/ci/check-nav-structure.py)

          python -m pip install check-jsonschema
          sed 's/\r$//' qaas-docs/tools/ci/validate-yaml-snippets.sh > "$RUNNER_TEMP/validate-yaml-snippets.sh"
          (cd qaas-docs && bash "$RUNNER_TEMP/validate-yaml-snippets.sh")

          fail=0
          if [ -d qaas-docs/docs/_meta ]; then
            echo "::error::v1 artifact present: qaas-docs/docs/_meta/ must not exist under v2."
            fail=1
          fi

          if grep -RIl --include='*.md' -E '^[[:space:]]*ai_summary[[:space:]]*:' qaas-docs/docs >/dev/null 2>&1; then
            echo "::error::Forbidden 'ai_summary:' frontmatter key found in generated docs:"
            grep -RIln --include='*.md' -E '^[[:space:]]*ai_summary[[:space:]]*:' qaas-docs/docs || true
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          echo "Docs v2 contract passed: frontmatter, markdownlint, verification markers, reference skeleton, headings, heading anchors, example density, and schema-backed YAML snippets are valid; no _meta/ or ai_summary."

      - name: Validate generated docs PR size
        if: steps.docs_sync.outputs.enabled == 'true' && steps.docs_sync.outputs.check_only != 'true'
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$(git -C qaas-docs status --porcelain | wc -l | tr -d '[:space:]')"
          echo "Generated docs changed files: $changed_files / $MAX_DOCS_PR_CHANGED_FILES"

          if [ "$changed_files" -gt "$MAX_DOCS_PR_CHANGED_FILES" ]; then
            git -C qaas-docs diff --stat
            echo "::error::Generated qaas-docs PR would change $changed_files files, above the $MAX_DOCS_PR_CHANGED_FILES file limit. Fix the docs generator or mirror inputs before opening the PR."
            exit 1
          fi

      - name: Commit docs updates
        if: steps.docs_sync.outputs.enabled == 'true' && steps.docs_sync.outputs.check_only != 'true'
        id: docs_commit
        shell: pwsh
        run: |
          if (-not (git -C qaas-docs status --porcelain)) {
            "has_changes=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "No qaas-docs changes detected."
            exit 0
          }

          git -C qaas-docs checkout -b "${{ steps.refs.outputs.docs_branch }}"
          git -C qaas-docs config user.name "qaas-package-mirror"
          git -C qaas-docs config user.email "qaas-package-mirror@example.local"
          git -C qaas-docs add .
          git -C qaas-docs commit -m "docs: sync generated reference docs"
          "has_changes=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Push docs feature branch
        if: steps.docs_commit.outputs.has_changes == 'true'
        shell: pwsh
        run: git -C qaas-docs push origin "${{ steps.refs.outputs.docs_branch }}"

      - name: Create docs pull request
        if: steps.docs_commit.outputs.has_changes == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
        run: |
          gh pr create `
            --repo TheSmokeTeam/qaas-docs `
            --base master `
            --head "${{ steps.refs.outputs.docs_branch }}" `
            --title "docs: sync generated reference docs from package mirror" `
            --body "## Summary`n- refresh reference documentation from the latest mirrored package state`n- update bundled schema assets (schema.json, docs-manifest.json, hook-catalog.json) so the docs site ships current downloadable contracts`n- regenerate Runner, Mocker, Framework, and hook Markdown from the mirrored source refs, including canonical nested-list indentation owned by this PackageMirror workflow`n- update the docs generator submodule to the current main commit used by PackageMirror`n- write the fixed qaas-docs.zim provenance contract for docs date ${{ steps.refs.outputs.docs_updated_date_utc }} (Name: QaaS Documantation; Title: Complete QaaS Documantation; Description: the same UTC date)"
