name: Sync Restored Packages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest

    steps:
      - name: Checkout mirror repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Refresh master before update
        shell: pwsh
        run: git pull --ff-only origin master

      - name: Rebuild mirror contents
        shell: pwsh
        env:
          PACKAGE_MIRROR_TOKEN: ${{ secrets.PACKAGE_MIRROR_TOKEN }}
        run: |
          .\scripts\Sync-RestoredPackages.ps1 `
            -GitHubToken $env:PACKAGE_MIRROR_TOKEN

      - name: Commit updated packages
        shell: pwsh
        run: |
          git config user.name "qaas-package-mirror"
          git config user.email "qaas-package-mirror@example.local"
          git add packages state README.md CHANGELOG.md scripts .github/workflows/sync-packages.yml
          if ((git diff --cached --name-only).Length -eq 0) {
            Write-Host "No mirror changes detected."
            exit 0
          }

          git commit -m "mirror: full sync"
          git push origin HEAD:master
